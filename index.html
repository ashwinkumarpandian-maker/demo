<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #e0f2fe, #ede9fe);
    }

    main {
      width: min(100%, 560px);
      padding: 56px 36px;
      text-align: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px #24304a1a;
    }

    .icon { font-size: 48px; }

    h1 {
      margin: 16px 0 12px;
      font-size: clamp(2rem, 8vw, 3.25rem);
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 auto 28px;
      max-width: 380px;
      color: #5b6475;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 13px 22px;
      color: white;
      font-weight: 600;
      text-decoration: none;
      background: #635bdb;
      border-radius: 12px;
    }

    a:hover { background: #5148c7; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">✨</div>
    <h1>Welcome!</h1>
    <p>We’re glad you’re here. Take a look around and make yourself at home.</p>
    <a href="mailto:hello@example.com">Get in touch</a>
  </main>
</body>
</html>
